[project]
name = "crud-api-ai"
version = "0.1.0"
description = "Production-quality RESTful CRUD API with FastAPI and SQLModel"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.139.2",
    "sqlmodel>=0.0.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
